services:
  jupyter:
    build:
      context: .
      target: development
    container_name: dnn-fhe-jupyter
    working_dir: /workspace
    # TensorFlow / torch dataloaders use /dev/shm for inter-process tensors;
    # the Docker default of 64MB is easily exhausted and surfaces as
    # opaque "Bus error" crashes. 2GB is plenty for these notebooks.
    shm_size: "2gb"
    environment:
      - HOME=/tmp
      # Quiet TensorFlow's default INFO/WARNING spam in notebook output.
      - TF_CPP_MIN_LOG_LEVEL=2
    extra_hosts:
      # Needed to allow the container to access external APIs inside the proxy.
      - "wsl-proxy:host-gateway"
    ports:
      - "${PORT:-8888}:8888"
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    volumes:
      # Mount this folder so notebooks created in Jupyter appear here.
      - .:/workspace
      # Expose the repo-root test_data folder so export scripts can drop
      # PNGs where the C++ apps (cifar10/build/main, accuracy, ...) can
      # find them via "../test_data/<dataset>/<count>".
      - ../test_data:/repo/test_data
    networks:
      - dnn_fhe_network

networks:
  dnn_fhe_network:
